<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screen Recording</title>
  <meta property="og:title"       content="Screen Recording" />
  <meta property="og:description" content="Watch this screen recording" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    }

    header {
      width: 100%; max-width: 1100px; padding: 20px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-mark {
      width: 32px; height: 32px; background: #FF5733; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .logo-text { font-size: 18px; font-weight: 600; }
    .close-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: none; background: #2a2a2a; color: #ccc;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
    }
    .close-btn:hover { background: #ff3b3b; color: #fff; }

    main { width: 100%; max-width: 1100px; padding: 0 24px 48px; flex: 1; }

    /* ── Player wrap with prev/next overlay buttons ────────── */
    .player-wrap {
      position: relative;
      width: 100%; aspect-ratio: 16 / 9; background: #1a1a1a;
      border-radius: 12px; overflow: hidden;
    }
    video { width: 100%; height: 100%; display: block; background: #000; }

    .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(0,0,0,0.55); color: #fff;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .2s, background .15s;
      z-index: 5;
    }
    .player-wrap:hover .nav-btn { opacity: 1; }
    .nav-btn:hover { background: rgba(0,0,0,0.85); }
    .nav-btn:disabled { opacity: 0 !important; cursor: not-allowed; }
    .nav-btn.prev { left: 12px; }
    .nav-btn.next { right: 12px; }

    .nav-counter {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,0.6);
      padding: 4px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 500; color: #ddd;
      pointer-events: none;
      z-index: 5;
    }

    /* ── Meta + actions ────────────────────── */
    .meta {
      margin-top: 20px; display: flex; align-items: flex-start;
      justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .title-wrap { min-width: 0; flex: 1; }
    .title-wrap h1 { font-size: 22px; font-weight: 600; line-height: 1.3; word-break: break-word; }
    .subtitle { margin-top: 6px; font-size: 14px; color: #888; }
    #copyStatus { font-size: 12px; color: #4caf50; margin-top: 6px; min-height: 18px; }

    .actions { display: flex; gap: 10px; flex-shrink: 0; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 16px; border-radius: 8px; font-size: 14px;
      font-weight: 500; cursor: pointer; border: none; text-decoration: none;
      transition: opacity .15s, background .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #FF5733; color: #fff; }
    .btn-secondary { background: #2a2a2a; color: #fff; }

    /* ── Loading / error states ───────────── */
    .state {
      text-align: center; padding: 80px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .state h2 { font-size: 24px; color: #FF5733; }
    .state p { color: #888; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,87,51,0.25);
      border-top-color: #FF5733; border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-mark">●</div>
      <span class="logo-text">Recorder</span>
    </div>
    <button class="close-btn" id="closeBtn" title="Close tab" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </header>

  <main id="main">
    <div class="state" id="loadingState">
      <div class="spinner"></div>
      <p>Loading recording…</p>
    </div>
  </main>

  <script>
    // ─────────────────────────────────────────────────────────
    // Public anon key — safe to ship in client. RLS controls access.
    // ─────────────────────────────────────────────────────────
    const SUPABASE_URL      = 'https://xzaeyozdjnklzikxnsay.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6YWV5b3pkam5rbHppa3huc2F5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODM2NTAsImV4cCI6MjA5MzA1OTY1MH0.8fZF_MJBMAtD23NLEsMOQY8qKYXcj-Uco3jm3jr-lRI';

    // ─── Helpers ───────────────────────────────────────────
    function publicUrl(path) {
      if (!path) return '';
      return SUPABASE_URL + '/storage/v1/object/public/videos/' + path;
    }
    function escHtml(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function formatDate(iso) {
      try {
        return new Date(iso).toLocaleDateString('en-US',
          { year: 'numeric', month: 'long', day: 'numeric' });
      } catch { return ''; }
    }
    function formatDuration(secs) {
      secs = Math.max(0, parseInt(secs, 10) || 0);
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return m + ':' + String(s).padStart(2, '0');
    }
    function showError(title, msg) {
      document.getElementById('main').innerHTML =
        '<div class="state"><h2>' + escHtml(title) + '</h2><p>' + escHtml(msg) + '</p></div>';
    }

    // ─── Header close button ───────────────────────────────
    document.getElementById('closeBtn').addEventListener('click', () => {
      // Try window.close() — only works for tabs opened by JS. Otherwise navigate
      // away to a blank page so the user feels the "close" affordance.
      window.close();
      // Fallback after a tick if close() was a no-op
      setTimeout(() => {
        if (!document.hidden) location.href = 'about:blank';
      }, 200);
    });

    // ─── Library state ─────────────────────────────────────
    let library    = [];   // all ready videos, newest first
    let currentIdx = -1;   // index in library

    // ─── Render the player for a given video index ─────────
    function renderPlayer(idx) {
      currentIdx = idx;
      const v = library[idx];
      if (!v) return showError('Recording not found', 'Index out of range.');

      const videoUrl     = publicUrl(v.storage_path);
      const thumbnailUrl = publicUrl(v.thumbnail_path);
      const titleSafe    = escHtml(v.title || 'Screen Recording');
      const subtitle     = formatDate(v.created_at) +
        (v.duration_secs ? ' · ' + formatDuration(v.duration_secs) : '');

      // Update document title and OG tags
      document.title = (v.title || 'Screen Recording') + ' — Screen Recording';
      const ogTitle = document.querySelector('meta[property="og:title"]');
      if (ogTitle) ogTitle.setAttribute('content', v.title || 'Screen Recording');

      const main = document.getElementById('main');
      main.innerHTML = `
        <div class="player-wrap">
          <button class="nav-btn prev" id="prevBtn" aria-label="Previous recording" ${idx >= library.length - 1 ? 'disabled' : ''}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>
          <video id="player" src="${escHtml(videoUrl)}" controls autoplay
                 poster="${escHtml(thumbnailUrl)}" preload="metadata"></video>
          <button class="nav-btn next" id="nextBtn" aria-label="Next recording" ${idx <= 0 ? 'disabled' : ''}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
          ${library.length > 1 ? `<div class="nav-counter">${idx + 1} / ${library.length}</div>` : ''}
        </div>
        <div class="meta">
          <div class="title-wrap">
            <h1>${titleSafe}</h1>
            <p class="subtitle">${escHtml(subtitle)}</p>
            <div id="copyStatus"></div>
          </div>
          <div class="actions">
            <button class="btn btn-secondary" id="copyBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              Copy link
            </button>
            <a class="btn btn-primary" href="${escHtml(videoUrl)}" download>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              Download
            </a>
          </div>
        </div>
      `;

      // Update URL without reload so refresh stays on same video
      const newUrl = new URL(window.location.href);
      newUrl.searchParams.set('t', v.share_token);
      history.replaceState(null, '', newUrl.toString());

      wirePlayer(v);
    }

    // ─── Wire up controls and slider seek-fix ──────────────
    function wirePlayer(v) {
      const video = document.getElementById('player');

      // Slider seek fix: webm files written by MediaRecorder usually have no
      // duration metadata, so the browser's seek bar can't scrub. Force load
      // the entire video and recompute duration from the buffered range.
      // Trick: seek to a huge time → browser updates duration → seek back.
      let durationFixed = false;
      const fixDuration = () => {
        if (durationFixed || !isFinite(video.duration) === false) return;
        if (video.duration === Infinity || isNaN(video.duration)) {
          durationFixed = true;
          const onTimeUpdate = () => {
            video.currentTime = 0;
            video.removeEventListener('timeupdate', onTimeUpdate);
            video.play().catch(() => {});
          };
          video.addEventListener('timeupdate', onTimeUpdate);
          // Seek to a very large value — browser will end up at real end
          video.currentTime = 1e10;
        }
      };
      video.addEventListener('loadedmetadata', fixDuration);
      // Also on durationchange in case Infinity → number happens later
      video.addEventListener('durationchange', () => {
        if (video.duration !== Infinity && !isNaN(video.duration)) durationFixed = true;
      });

      // Auto-advance to next video (older) when this one finishes
      video.addEventListener('ended', () => {
        if (currentIdx + 1 < library.length) renderPlayer(currentIdx + 1);
      });

      // Prev / Next buttons
      const prevBtn = document.getElementById('prevBtn'); // older recordings
      const nextBtn = document.getElementById('nextBtn'); // newer recordings
      if (prevBtn) prevBtn.addEventListener('click', () => {
        if (currentIdx + 1 < library.length) renderPlayer(currentIdx + 1);
      });
      if (nextBtn) nextBtn.addEventListener('click', () => {
        if (currentIdx - 1 >= 0) renderPlayer(currentIdx - 1);
      });

      // Keyboard arrows
      document.onkeydown = (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowLeft' && e.shiftKey)  prevBtn?.click();
        if (e.key === 'ArrowRight' && e.shiftKey) nextBtn?.click();
      };

      // Copy link
      document.getElementById('copyBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(window.location.href).then(() => {
          const s = document.getElementById('copyStatus');
          s.textContent = '✓ Link copied!';
          setTimeout(() => { s.textContent = ''; }, 2500);
        });
      });
    }

    // ─── Bootstrap: load library + locate current token ────
    async function load() {
      const params = new URLSearchParams(window.location.search);
      const token  = params.get('t');

      if (!token) {
        showError('Missing share token', 'This link is malformed.');
        return;
      }

      try {
        const url = SUPABASE_URL +
          '/rest/v1/videos?status=eq.ready&order=created_at.desc&select=*';
        const res = await fetch(url, {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
          },
        });
        if (!res.ok) throw new Error('Server error: ' + res.status);
        library = await res.json();

        const idx = library.findIndex(v => v.share_token === token);
        if (idx === -1) {
          showError('Recording not found', 'This link may have expired or been deleted.');
          return;
        }
        renderPlayer(idx);
      } catch (err) {
        console.error(err);
        showError('Could not load recording', err.message || 'Unknown error');
      }
    }

    load();
  </script>
</body>
</html>
